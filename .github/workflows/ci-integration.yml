# CI pipeline for the integration branch
# This workflow runs on every push/PR to the integration branch to validate changes
# before they are merged to main. It focuses on fast feedback with minimal artifact retention.
#
# Workflow:
#   1. Quality Gates: Run all lints, type checks, and tests in parallel
#   2. Build Check: Build Tauri application for Linux to verify build succeeds
#
# Path filters skip CI for documentation-only changes to save CI minutes.
#
name: Integration Quality Gates

on:
  push:
    branches:
      - integration
    # Skip CI for documentation-only changes
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - integration
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read # Least privilege: only need to read repository content

# Cancel in-progress runs for the same ref to save CI resources
concurrency:
  group: integration-quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run all quality gates (lint, typecheck, unit tests, E2E tests, Rust tests)
  # This uses a reusable workflow to ensure consistency with ci-main.yml
  quality-gates:
    name: Quality Gates
    uses: ./.github/workflows/quality-gates.yml
    with:
      upload-coverage: true # Upload coverage artifacts for review

  # Build Tauri application to verify the build process works
  # Only runs on Linux to save time (multi-platform builds happen in ci-main.yml)
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [quality-gates] # Wait for quality gates to pass before building
    timeout-minutes: 30
    steps:
      # Setup Node.js, checkout code, and install dependencies
      - uses: ./.github/actions/setup-node-deps

      # Install Linux system dependencies required for Tauri builds
      - uses: ./.github/actions/setup-tauri-deps

      # Install Rust toolchain with default stable version
      - uses: ./.github/actions/setup-rust

      # Build the React frontend (outputs to dist/)
      - name: Build frontend
        run: npm run build

      # Build Tauri bundle (creates .deb and .AppImage for Linux)
      - name: Build Tauri bundle
        run: npm run tauri:build

      # Upload build artifacts for manual testing if needed
      # Short retention (3 days) since these are not release artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: integration-build-artifacts
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 3
          if-no-files-found: warn
