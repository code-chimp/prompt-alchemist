# CI/CD pipeline for the main branch
# This workflow runs on every push to main and creates release builds for all platforms
#
# Workflow stages:
#   1. Quality Gates: Run all lints, type checks, and tests
#   2. Multi-platform Builds: Build Tauri application for Windows, macOS, and Linux
#   3. Create GitHub Release: Publish draft release with all platform artifacts
#
# Path filters skip CI for documentation-only changes.
# Release artifacts are retained for 30 days (longer than integration builds).
#
name: Main Branch CI/CD

on:
  push:
    branches:
      - main
    # Skip CI for documentation-only changes
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
    # Also trigger on version tags for release automation
    tags:
      - 'v*'

permissions:
  contents: write # Needed to create GitHub releases

# Prevent multiple concurrent builds on main to avoid conflicts
concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: false # Don't cancel release builds

jobs:
  # Run all quality gates before building release artifacts
  quality-gates:
    name: Quality Gates
    uses: ./.github/workflows/quality-gates.yml
    with:
      upload-coverage: true

  # Build Tauri application for all supported platforms
  # This job runs in a matrix to build for Windows, macOS (both Intel and ARM), and Linux
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: [quality-gates] # Only build if quality gates pass
    timeout-minutes: 60 # Tauri builds can take 30-45 minutes

    strategy:
      fail-fast: false # Continue building other platforms even if one fails
      matrix:
        include:
          # Linux build (produces .deb and .AppImage)
          - platform: 'Linux'
            os: ubuntu-latest
            target: ''

          # Windows build (produces .msi and .exe installer)
          - platform: 'Windows'
            os: windows-latest
            target: ''

          # macOS Intel build (produces .dmg and .app)
          - platform: 'macOS (Intel)'
            os: macos-latest
            target: 'x86_64-apple-darwin'

          # macOS ARM build (produces .dmg and .app for Apple Silicon)
          - platform: 'macOS (ARM)'
            os: macos-latest
            target: 'aarch64-apple-darwin'

    steps:
      # Setup Node.js, checkout code, and install dependencies
      - uses: ./.github/actions/setup-node-deps

      # Install Linux system dependencies (only runs on Linux)
      - name: Install Tauri dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/setup-tauri-deps

      # Install Rust with optional target specification for cross-compilation
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}

      # Build the React frontend
      - name: Build frontend
        run: npm run build

      # Build Tauri application for the current platform
      - name: Build Tauri bundle
        run: npm run tauri:build
        env:
          # Add any platform-specific environment variables here
          # Example: APPLE_CERTIFICATE, APPLE_ID for macOS code signing
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      # Upload build artifacts with platform-specific naming
      # Longer retention (30 days) since these are potential release candidates
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.platform }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
          retention-days: 30
          if-no-files-found: error # Fail if build didn't produce artifacts

  # Create a GitHub release with all platform artifacts (only on version tags)
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    # Only run on version tags (e.g., v1.0.0)
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download all build artifacts from previous job
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # Create a draft GitHub release with all platform binaries
      # draft: true requires manual approval before publishing
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true # Create as draft for manual review
          generate_release_notes: true # Auto-generate changelog from commits
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
