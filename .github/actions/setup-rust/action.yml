name: 'Setup Rust Toolchain'
description: 'Setup Rust toolchain with caching for Cargo dependencies'

inputs:
  toolchain:
    description: 'Rust toolchain version'
    required: false
    default: 'stable'
  components:
    description: 'Rust components to install (comma-separated, e.g., "rustfmt, clippy")'
    required: false
    default: ''
  target:
    description: 'Rust target triple (e.g., x86_64-unknown-linux-gnu)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Install Rust toolchain using dtolnay/rust-toolchain (replaces deprecated actions-rs/toolchain)
    # This action is officially recommended and actively maintained
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.target }}

    # Cache Cargo dependencies to speed up builds
    # Key includes Cargo.lock hash for proper invalidation on dependency changes
    # Excludes ~/.cargo/bin/ to prevent tool version conflicts
    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          src-tauri/target/
        key: ${{ runner.os }}-cargo-${{ inputs.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ inputs.toolchain }}-
          ${{ runner.os }}-cargo-
