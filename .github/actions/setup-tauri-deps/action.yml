name: 'Setup Tauri Dependencies'
description: 'Install Linux system dependencies required for Tauri builds'

runs:
  using: 'composite'
  steps:
    # Install system libraries required for Tauri to build on Linux
    # These include webkit2gtk (for webview), SSL, GTK3, and app indicator support
    # This step is only needed for actual Tauri builds, not for linting/typechecking
    - name: Install Linux dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          libssl-dev \
          libgtk-3-dev \
          libglib2.0-dev \
          pkg-config \
          libayatana-appindicator3-dev \
          librsvg2-dev
